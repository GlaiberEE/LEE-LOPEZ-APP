<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevated Exteriors · Pida su cotización</title>
<link rel="icon" href="/brand/favicon-32.png">
<style>
  @font-face { font-family: 'DM Sans'; src: url('/fonts/dm-sans-latin.woff2') format('woff2'); font-weight: 100 1000; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; background: #f4f4ef; color: #1d1d1d; }
  header { background: #1b1b1b; padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; }
  header img { height: 40px; filter: invert(1); }
  header button { background: #2c2c2c; color: #c5e05a; border: 0; border-radius: 8px; padding: .45rem .7rem; font-weight: 700; cursor: pointer; }
  main { max-width: 620px; margin: 0 auto; padding: 1.25rem; }
  h1 { color: #02175d; margin: .4rem 0 .2rem; font-size: 1.7rem; }
  p.lead { color: #555; margin-top: 0; }
  form { background: #fff; border-radius: 14px; padding: 1.25rem; box-shadow: 0 6px 24px rgba(0,0,0,.06); display: grid; gap: .9rem; }
  label { font-weight: 700; font-size: .92rem; display: block; margin-bottom: .3rem; }
  input, select, textarea { width: 100%; font: inherit; padding: .75rem; border: 1px solid #cfcfc8; border-radius: 10px; min-height: 48px; background: #fff; }
  textarea { min-height: 110px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; }
  @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
  .hp { position: absolute; left: -9999px; }
  button.send { background: #c5e05a; color: #111; border: 0; border-radius: 12px; padding: 1rem; font-size: 1.1rem; font-weight: 800; cursor: pointer; min-height: 54px; }
  button.send:disabled { opacity: .6; }
  .err { color: #b00; font-weight: 600; min-height: 1.2em; }
  .ok { background: #fff; border-radius: 14px; padding: 2rem 1.25rem; text-align: center; }
  .ok h2 { color: #02175d; }
  small { color: #777; }
</style>
</head>
<body>
<header><img src="/brand/ee-logo.png" alt="Elevated Exteriors"><button type="button" id="lang">EN</button></header>
<main>
  <h1 data-t="title">Pida su cotización</h1>
  <p class="lead" data-t="lead">Patios cubiertos, cocinas exteriores, chimeneas y más en el área de Dallas–Fort Worth. Le contactamos en menos de 24 horas.</p>
  <form id="f" novalidate>
    <div><label for="name" data-t="name">Nombre *</label><input id="name" name="name" autocomplete="name" required maxlength="120"></div>
    <div class="two">
      <div><label for="phone" data-t="phone">Teléfono</label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40"></div>
      <div><label for="email" data-t="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="120"></div>
    </div>
    <div><label for="address" data-t="address">Dirección del proyecto</label><input id="address" name="address" autocomplete="street-address" maxlength="250"></div>
    <div><label for="project_type" data-t="type">¿Qué le interesa?</label>
      <select id="project_type" name="project_type">
        <option value="patio_cover" data-t="t_patio">Patio cubierto (pérgola / patio cover)</option>
        <option value="outdoor_living" data-t="t_living">Sala exterior completa</option>
        <option value="outdoor_kitchen" data-t="t_kitchen">Cocina exterior</option>
        <option value="fireplace" data-t="t_fireplace">Chimenea</option>
        <option value="fire_pit" data-t="t_pit">Fogón (fire pit)</option>
        <option value="tv_wall" data-t="t_tv">Pared para TV</option>
        <option value="otro" data-t="t_other">Otro</option>
      </select></div>
    <div class="two">
      <div><label for="budget" data-t="budget">Presupuesto aproximado</label><select id="budget" name="budget"><option value="" data-t="b_none">Prefiero no decir</option><option>$10k–$25k</option><option>$25k–$50k</option><option>$50k–$100k</option><option>$100k+</option></select></div>
      <div><label for="timeline" data-t="when">¿Para cuándo?</label><select id="timeline" name="timeline"><option value="" data-t="w_none">Todavía no sé</option><option value="1-3 meses" data-t="w_soon">1 a 3 meses</option><option value="3-6 meses" data-t="w_mid">3 a 6 meses</option><option value="6+ meses" data-t="w_late">Más de 6 meses</option></select></div>
    </div>
    <div><label for="message" data-t="msg">Cuéntenos de su proyecto</label><textarea id="message" name="message" maxlength="3000"></textarea></div>
    <div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
    <div class="err" id="err"></div>
    <button class="send" type="submit" data-t="send">Pedir cotización</button>
    <small data-t="privacy">Usamos sus datos solo para contactarle sobre su proyecto.</small>
  </form>
  <div class="ok" id="ok" hidden><h2 data-t="thanks">¡Gracias!</h2><p data-t="thanks2">Recibimos su solicitud. Le contactamos pronto.</p></div>
</main>
<script src="/cotizar.js"></script>
</body>
</html>
